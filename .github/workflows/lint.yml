# ==============================================================================
# File: .github/workflows/lint.yml
#
# Purpose: Run code quality checks on push to main, pull requests, and manual triggers
#
# Triggers: push to main, pull_request to main, workflow_dispatch
#
# Jobs:
#   - lint: Run ruff, pylint, mypy, bandit, and thailint checks
#
# Tools:
#   - ruff: Fast linting and formatting
#   - pylint: Comprehensive Python linting
#   - mypy: Static type checking
#   - bandit: Security vulnerability scanning
#   - thailint: Custom checks (magic-numbers, nesting, srp)
# ==============================================================================

name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Run Ruff
        run: uv run ruff check src/ tests/

      - name: Run Ruff Format Check
        run: uv run ruff format --check src/ tests/

      - name: Run Pylint
        run: uv run pylint src/safeshell

      - name: Run MyPy
        run: uv run mypy src/safeshell

      - name: Run Bandit
        run: uv run bandit -r src/safeshell -c pyproject.toml

      # ThaiLint checks are informational (non-blocking) until violations are fixed
      - name: Run thailint magic-numbers (informational)
        run: uv run thailint magic-numbers src/ || true

      - name: Run thailint nesting (informational)
        run: uv run thailint nesting src/ || true

      - name: Run thailint srp (informational)
        run: uv run thailint srp src/ || true
