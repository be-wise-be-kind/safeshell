# ==============================================================================
# File: .github/workflows/test.yml
#
# Purpose: Run unit tests on push to main, pull requests, and manual triggers
#
# Triggers: push to main, pull_request to main, workflow_dispatch
#
# Jobs:
#   - test: Run pytest unit tests with coverage on Python 3.11 and 3.12
#
# Features:
#   - Multi-Python version matrix testing (3.11, 3.12)
#   - uv dependency management with automatic caching
#   - 50% coverage threshold enforcement (increase as test coverage improves)
#   - Codecov integration (Python 3.11 only)
# ==============================================================================

name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short

      - name: Run tests with coverage
        run: uv run pytest tests/ --cov=src/safeshell --cov-report=term --cov-report=xml

      - name: Check coverage threshold
        run: uv run coverage report --fail-under=50

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: matrix.python-version == '3.11'
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
